name: tests

# Runs the full Onward suite (786 assertions) on every push and PR, so a
# regression is caught here instead of on Render after a deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # lets you re-run it by hand from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Node 24 matches local dev. The suite uses the built-in node:sqlite for
      # its real database round-trips, which needs a modern Node.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # npm ci installs exactly what package-lock.json pins, so CI tests the same
      # versions production runs. --omit=dev skips Electron (~100MB, irrelevant here).
      - name: Install dependencies
        run: npm ci --omit=dev

      # The suite boots the real Express app on an ephemeral port and does live
      # HTTP + DB round-trips, so no extra services are required.
      - name: Run test suite
        run: node tests/run.js

      # A silently-broken backup tool is worse than none, so prove the
      # dump → wipe → restore round-trip on every commit.
      - name: Verify backup/restore round-trip
        run: node tests/backup.js

      # cloud/db.js hand-maintains SQLite and Postgres schemas side by side.
      # Adding a column to one branch and forgetting the other works fine in
      # local dev and 500s in production, so fail the build on drift instead.
      - name: Verify SQLite/Postgres schema parity
        run: node tests/schema-parity.js

      # app.js builds markup from string templates, so nothing catches a missing
      # label. These guards keep unnamed controls from creeping back in.
      - name: Verify accessibility guards
        run: node tests/a11y.js

      # Guard the deploy target too: cloud/ is what Render actually installs
      # (Root Directory = cloud), so a broken manifest there breaks production
      # even when the tests above pass.
      - name: Verify the deployed backend's manifest and syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('cloud/package.json','utf8'))"
          node --check cloud/server.js
          node --check cloud/db.js
          node --check public/app.js
